<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- App icon (canon §2.3 form 6): Q symbol centered on an Ink rounded square.
       The tail reads Ivory here because the dark tail would vanish on Ink;
       small-size variants may drop the radiance strokes (canon §2.4). Keep in
       sync with components/Logo.tsx. -->
  <rect width="64" height="64" rx="14" fill="#0f1b2b"/>
  <circle cx="30" cy="32" r="15" fill="none" stroke="#ff6b4a" stroke-width="7"/>
  <line x1="40" y1="42" x2="50" y2="52" stroke="#faf8f4" stroke-width="7" stroke-linecap="round"/>
</svg>
